name: FeatherMiss two-mode integration

on:
  pull_request:
    paths:
      - packages/frontend/**
      - packages/frontend-shared/**
      - .github/workflows/feathermiss-two-mode.yml
  workflow_dispatch:

jobs:
  validate:
    name: Validate FEATHERMISS_UI=${{ matrix.feathermiss_ui }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feathermiss_ui: ['0', '1']
    env:
      FEATHERMISS_UI: ${{ matrix.feathermiss_ui }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          submodules: true
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend typecheck
      - run: pnpm --filter frontend eslint
      - run: pnpm --filter frontend test
      - run: pnpm build
      - name: Playwright smoke tests
        run: pnpm start-server-and-test start:test http://localhost:61812 "pnpm --filter frontend test:e2e"
        timeout-minutes: 20
